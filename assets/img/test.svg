      <line x1="0" y1="72" x2="0" y2="54" stroke="#52D98E" stroke-width="3" stroke-linecap="round" opacity=".55"/>

      <g transform="scale(.62)">
        <g transform="translate(-18 -16)">
          <rect x="-36" y="-32" width="72" height="26" rx="9" fill="none" stroke="#52D98E" stroke-width="4"/>
          <rect x="-36" y="2" width="72" height="26" rx="9" fill="none" stroke="#52D98E" stroke-width="4"/>
          <rect x="-36" y="36" width="72" height="26" rx="9" fill="none" stroke="#52D98E" stroke-width="4"/>
          <circle cx="-18" cy="-19" r="3.7" fill="#A4F7C5"/>
          <circle cx="-4" cy="-19" r="3.7" fill="#A4F7C5" opacity=".8"/>
          <circle cx="-18" cy="15" r="3.7" fill="#A4F7C5"/>
