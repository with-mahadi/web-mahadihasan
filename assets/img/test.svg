    <rect x="370" y="320" width="46" height="33" rx="10" fill="#FFFFFF" fill-opacity=".012" stroke="#35C8F6" stroke-opacity=".72"/>
    <text x="393" y="341" class="tagText" text-anchor="middle" fill="#35C8F6">UI</text>
  </g>

  <!-- BACKEND CARD -->
  <g filter="url(#shadow)">
