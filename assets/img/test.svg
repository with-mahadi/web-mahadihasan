      <circle r="68" fill="none" stroke="#52D98E" stroke-opacity=".11" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#52D98E" stroke-opacity=".68" stroke-width="4" filter="url(#glowGreen)"/>
      <circle r="42" fill="none" stroke="#52D98E" stroke-opacity=".15" stroke-width="1.5"/>
      <line x1="-72" y1="0" x2="-54" y2="0" stroke="#52D98E" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="0" x2="54" y2="0" stroke="#52D98E" stroke-width="3" stroke-linecap="round"/>
