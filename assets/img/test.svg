    <text x="604" y="218" class="copy" fill="#A6D4BC">Scalable APIs, REST &amp; GraphQL</text>
    <text x="604" y="247" class="copy" fill="#A6D4BC">powered by Node.js &amp; MongoDB.</text>
    <circle cx="613" cy="290" r="6.5" fill="#52D98E" filter="url(#glowGreen)"/>
    <text x="632" y="294" class="status" fill="#52D98E">RUNNING</text>

