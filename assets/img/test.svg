<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="52%" stop-color="#07111C"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#12264A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07111C" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#D7E4FF" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>

    <linearGradient id="fillFrontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06131E"/>
      <stop offset="100%" stop-color="#081A29"/>
    </linearGradient>

    <linearGradient id="fillBackend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071611"/>
      <stop offset="100%" stop-color="#092018"/>
    </linearGradient>

    <linearGradient id="fillShopify" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130C1D"/>
      <stop offset="100%" stop-color="#181128"/>
    </linearGradient>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000814" flood-opacity="0.65"/>
    </filter>

    <filter id="glowCyan" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowGreen" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowPurple" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .label { font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 7px; }
      .title { font: 800 22px Inter, Segoe UI, Arial, sans-serif; letter-spacing: .4px; }
      .copy { font: 400 12px Inter, Segoe UI, Arial, sans-serif; }
      .status { font: 700 11px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 1.1px; }
      .tagText { font: 700 11px Inter, Segoe UI, Arial, sans-serif; letter-spacing: .5px; }
      .pulse { animation: pulse 3.3s ease-in-out infinite; }
      .softPulse { animation: softPulse 4.2s ease-in-out infinite; }
      .borderRun { animation: borderRun 7s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: .95; } }
      @keyframes softPulse { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
      @keyframes borderRun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -950; } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#bgGlow)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="364" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>

  <!-- FRONTEND CARD -->
  <g filter="url(#shadow)">
    <rect x="28" y="50" width="368" height="300" rx="18" fill="url(#fillFrontend)"/>
    <rect x="28" y="50" width="368" height="300" rx="18" fill="none" stroke="#35C8F6" stroke-opacity=".18"/>
    <rect x="29.5" y="51.5" width="365" height="297" rx="16.5" fill="none" stroke="#35C8F6" stroke-opacity=".36" stroke-width="1.2" stroke-dasharray="170 980" class="borderRun"/>

    <line x1="62" y1="68" x2="129" y2="68" stroke="#35C8F6" stroke-width="2" stroke-linecap="round" opacity=".88"/>
    <line x1="295" y1="68" x2="362" y2="68" stroke="#35C8F6" stroke-width="2" stroke-linecap="round" opacity=".88"/>
    <line x1="62" y1="332" x2="129" y2="332" stroke="#35C8F6" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <line x1="295" y1="332" x2="362" y2="332" stroke="#35C8F6" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <path d="M48 88 L48 68 L72 68" fill="none" stroke="#35C8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
    <path d="M376 88 L376 68 L352 68" fill="none" stroke="#35C8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
    <path d="M48 312 L48 332 L72 332" fill="none" stroke="#35C8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="softPulse"/>
    <path d="M376 312 L376 332 L352 332" fill="none" stroke="#35C8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="softPulse"/>
    <circle cx="46" cy="332" r="3.3" fill="#35C8F6" opacity=".9"/>
    <circle cx="378" cy="332" r="3.3" fill="#8EE7FF" opacity=".7"/>

    <text x="212" y="80" class="label" text-anchor="middle" fill="#35C8F6">FRONTEND STUDIO</text>
    <line x1="72" y1="100" x2="352" y2="100" stroke="#35C8F6" stroke-opacity=".12"/>

    <!-- smaller circle + icon -->
    <g transform="translate(133 214) scale(.72)">
      <circle r="68" fill="none" stroke="#35C8F6" stroke-opacity=".11" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#35C8F6" stroke-opacity=".68" stroke-width="4" filter="url(#glowCyan)"/>
      <circle r="42" fill="none" stroke="#35C8F6" stroke-opacity=".15" stroke-width="1.5"/>
      <line x1="-72" y1="0" x2="-54" y2="0" stroke="#35C8F6" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="0" x2="54" y2="0" stroke="#35C8F6" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-72" x2="0" y2="-54" stroke="#35C8F6" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="72" x2="0" y2="54" stroke="#35C8F6" stroke-width="3" stroke-linecap="round" opacity=".55"/>

      <g transform="scale(.62)">
        <rect x="-42" y="-43" width="84" height="90" rx="12" fill="none" stroke="#35C8F6" stroke-width="4"/>
        <line x1="-42" y1="-18" x2="42" y2="-18" stroke="#35C8F6" stroke-width="3" opacity=".8"/>
        <circle cx="-25" cy="-31" r="3.6" fill="#8EE7FF"/>
        <circle cx="-12" cy="-31" r="3.6" fill="#8EE7FF"/>
        <circle cx="1" cy="-31" r="3.6" fill="#8EE7FF"/>
        <path d="M-14 15 L-33 31 L-14 47" fill="none" stroke="#35C8F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 15 L33 31 L14 47" fill="none" stroke="#35C8F6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="2" y1="14" x2="-6" y2="48" stroke="#35C8F6" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <text x="216" y="168" class="title" fill="#EEF4FA">FRONTEND DEV</text>
    <line x1="216" y1="182" x2="360" y2="182" stroke="#35C8F6" stroke-opacity=".12"/>
    <text x="216" y="218" class="copy" fill="#A6C7D5">Pixel-perfect, blazing-fast</text>
    <text x="216" y="247" class="copy" fill="#A6C7D5">UIs with React &amp; Next.js.</text>
    <circle cx="225" cy="290" r="6.5" fill="#35C8F6" filter="url(#glowCyan)"/>
    <text x="244" y="294" class="status" fill="#35C8F6">ACTIVE</text>

    <rect x="216" y="320" width="58" height="33" rx="10" fill="#FFFFFF" fill-opacity=".012" stroke="#35C8F6" stroke-opacity=".72"/>
